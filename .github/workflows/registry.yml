name: Registry CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.debt-scan.json'
      - '.stack-debt-baseline.json'
      - 'catalog/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.debt-scan.json'
      - '.stack-debt-baseline.json'
      - 'catalog/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test, Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure deterministic source date
        run: |
          node -e 'const fs = require("node:fs"); const { generatedAt } = JSON.parse(fs.readFileSync("index.json", "utf8")); const epoch = Date.parse(generatedAt) / 1000; if (typeof generatedAt !== "string" || !Number.isInteger(epoch) || new Date(epoch * 1000).toISOString() !== generatedAt) throw new Error("index.json generatedAt must be an ISO timestamp with whole-second precision"); process.stdout.write("SOURCE_DATE_EPOCH=" + epoch + "\n");' >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build registry
        run: npm run build

      - name: Verify release provenance
        run: npm run release:verify

      - name: Validate public readiness
        run: npm run validate:public -- --json

      - name: Verify generated index
        run: npm run indexes:check

      - name: Verify clean catalog source
        run: npm run catalog:clean:check

      - name: Verify changed stack packages
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run stacks:verify -- --changed-from "${{ github.event.pull_request.base.sha || github.event.before }}" --prepare

      - name: Scan JavaScript and TypeScript debt
        run: npm run debt:scan

      - name: Verify package contents
        run: npm pack --dry-run --json

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: registry-dist
          path: dist/
          retention-days: 30

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure deterministic source date
        run: |
          node -e 'const fs = require("node:fs"); const { generatedAt } = JSON.parse(fs.readFileSync("index.json", "utf8")); const epoch = Date.parse(generatedAt) / 1000; if (typeof generatedAt !== "string" || !Number.isInteger(epoch) || new Date(epoch * 1000).toISOString() !== generatedAt) throw new Error("index.json generatedAt must be an ISO timestamp with whole-second precision"); process.stdout.write("SOURCE_DATE_EPOCH=" + epoch + "\n");' >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build registry
        run: npm run build

      - name: Verify release provenance
        run: npm run release:verify

      - name: Validate public readiness
        run: npm run validate:public -- --json

      - name: Get version and date
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date +%Y%m%d)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${DATE}" >> $GITHUB_OUTPUT

      - name: Create release tarball
        run: |
          mkdir -p release
          tar -czf release/registry.tgz \
            --exclude='*/node_modules/*' \
            --exclude='*/runs/*' \
            --exclude='*/downloads/*' \
            --exclude='*/tmp/*' \
            --exclude='*/.chrome-profiles/*' \
            --exclude='*/.test-rudi/*' \
            --exclude='*/composer/public/media/*' \
            --exclude='*/clips/*' \
            --exclude='*/output/*' \
            --exclude='*/outputs/*' \
            catalog/ \
            schemas/ \
            dist/ \
            SCHEMA.md
          sha256sum release/registry.tgz > release/registry.tgz.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: registry-release
          path: release/
          retention-days: 90

      # Optional: Create GitHub Release on tags
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/registry.tgz
            release/registry.tgz.sha256
            dist/index.json
            dist/release.json
          generate_release_notes: true

  # Cross-platform validation
  validate-platforms:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests
        run: npm run validate
